name: 构建电子书

# 每次推送到 main 都重建 PDF / EPUB / MOBI, 并更新滚动预发布.
#
# 单 job 直发: 构建完就地用 gh 上传到 release, 不经过 upload-artifact.
# 中间那层 artifact 中转只会带来额外失败点 (路径 glob 规则, 子目录结构),
# 而产物最终就是要去 release, 没有别的消费方.

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "scripts/build_book.py"
      - ".github/workflows/book.yml"
  workflow_dispatch:
    inputs:
      formats:
        description: "要构建的格式, 逗号分隔 (pdf,epub,mobi)"
        required: false
        default: "pdf,epub,mobi"

permissions:
  contents: write

concurrency:
  group: book-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: book-latest

jobs:
  build:
    name: 构建并发布
    runs-on: ubuntu-24.04
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 准备 uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          enable-cache: false

      - name: 安装中文字体
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-noto-cjk

      - name: 安装 pandoc
        env:
          PANDOC_VERSION: "3.12.1"
        run: |
          set -euo pipefail
          url="https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb"
          curl -fsSL -o /tmp/pandoc.deb "$url"
          sudo dpkg -i /tmp/pandoc.deb
          pandoc --version | head -1

      - name: 安装 typst
        env:
          TYPST_VERSION: "0.15.1"
        run: |
          set -euo pipefail
          url="https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz"
          curl -fsSL -o /tmp/typst.tar.xz "$url"
          tar -xJf /tmp/typst.tar.xz -C /tmp
          sudo install -m 0755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
          typst --version

      - name: 构建 PDF 与 EPUB
        env:
          PROJECT_BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          fmt="${{ github.event.inputs.formats || 'pdf,epub,mobi' }}"
          args=""
          case "$fmt" in *epub*) ;; *) args="$args --no-epub" ;; esac
          case "$fmt" in *pdf*)  ;; *) args="$args --no-pdf"  ;; esac
          uv run --no-project python scripts/build_book.py --no-mobi $args

      # Calibre 只用来出 MOBI. 装不上或转失败都不该拖垮 PDF 与 EPUB,
      # 因此这步允许失败, 后面按实际存在的文件发布.
      - name: 安装 Calibre
        id: calibre
        continue-on-error: true
        run: |
          set -euo pipefail
          sudo apt-get install -y -qq calibre
          ebook-convert --version

      - name: 构建 MOBI
        continue-on-error: true
        env:
          PROJECT_BUILD_VERSION: ${{ github.sha }}
        run: |
          set -euo pipefail
          fmt="${{ github.event.inputs.formats || 'pdf,epub,mobi' }}"
          case "$fmt" in *mobi*) ;; *) echo "本次不需要 MOBI"; exit 0 ;; esac
          uv run --no-project python scripts/build_book.py --no-pdf --no-epub

      - name: 整理资产
        run: |
          set -euo pipefail
          mkdir -p out
          shopt -s nullglob
          for f in dist/*.pdf;  do cp "$f" out/reverse-engineering-chinese.pdf;  done
          for f in dist/*.epub; do cp "$f" out/reverse-engineering-chinese.epub; done
          for f in dist/*.mobi; do cp "$f" out/reverse-engineering-chinese.mobi; done
          echo "dist 里的构建结果:"
          ls -la dist || true
          echo "整理后的资产:"
          ls -la out
          test -s out/reverse-engineering-chinese.pdf
          test -s out/reverse-engineering-chinese.epub

      - name: 生成说明
        env:
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          short="${SHA:0:7}"
          {
            echo "本预发布由每次推送到 main 自动重建, 资产名固定, 内容随提交滚动更新."
            echo
            echo "- 构建提交: \`${short}\`"
            echo "- 构建时间: $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo
            echo "| 文件 | 说明 |"
            echo "| --- | --- |"
            echo "| \`reverse-engineering-chinese.pdf\` | 适合打印与屏幕阅读 |"
            echo "| \`reverse-engineering-chinese.epub\` | 适合绝大多数阅读器 |"
            if [ -s out/reverse-engineering-chinese.mobi ]; then
              echo "| \`reverse-engineering-chinese.mobi\` | 适合旧款 Kindle |"
            else
              echo
              echo "本次未生成 MOBI, 其余格式不受影响."
            fi
          } > notes.md
          cat notes.md

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" --notes-file notes.md
          else
            gh release create "$RELEASE_TAG" \
              --prerelease \
              --title "中文电子书 (滚动构建)" \
              --notes-file notes.md \
              --target "$SHA"
          fi
          shopt -s nullglob
          gh release upload "$RELEASE_TAG" out/* --clobber
          echo "当前资产:"
          gh release view "$RELEASE_TAG" --json assets \
            --jq '.assets[] | "  \(.name)  \(.size) 字节"'
